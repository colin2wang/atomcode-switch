[package]
name = "atomcode-switch"
version = "0.1.5"
edition = "2024"

[dependencies]
# GUI 框架（裁剪默认特性，仅保留必要后端）
eframe = { version = "0.27.2", default-features = false, features = [
    "default_fonts",
    "wgpu",
] }
egui = { version = "0.27.2", default-features = false }

# 序列化与反序列化
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"

# 文件对话框（轻量替代 rfd）
tinyfiledialogs = "3"

# 窗口图标解码（轻量替代 image）
ico = "0.4"

# 时间与时区处理
chrono = "0.4"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
debug = false
incremental = false